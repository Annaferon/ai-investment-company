name: Load Price History

on:
  schedule:
    # Воскресенье, 06:00 МСК (03:00 UTC) — инкремент 7 дней
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      history_days:
        description: 'Дней истории (по умолчанию 7; для полной — 1460)'
        required: false
        default: '7'
        type: string

jobs:
  load-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load History
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_NOTIFY: ${{ secrets.DEBUG_NOTIFY }}
          HISTORY_DAYS: ${{ github.event.inputs.history_days || '7' }}
        run: python history_main.py
