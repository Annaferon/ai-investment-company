name: Run Oracle

on:
  schedule:
    # Каждый час — крипта 24/7, MOEX/ЦБ только в рабочие часы
    - cron: '0 * * * *'
    # Дополнительный запуск в 13:00 МСК (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Oracle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_NOTIFY: ${{ secrets.DEBUG_NOTIFY }}
        run: python oracle_main.py
