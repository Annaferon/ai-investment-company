name: Run Oracle

on:
  schedule:
    # 01:00 МСК = 22:00 UTC (пред. день) — к 07:00 МСК
    - cron: '0 22 * * *'
    # 12:00 МСК = 09:00 UTC — к 18:00 МСК
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Oracle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python oracle_main.py
