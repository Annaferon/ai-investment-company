name: Run Oracle

on:
  schedule:
    # 07:00 МСК = 04:00 UTC — перед началом торгов
    - cron: '0 4 * * *'
    # 18:00 МСК = 15:00 UTC — перед вечерним Trader
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Oracle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python oracle_main.py
